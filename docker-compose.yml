# Local dev infra for Unified Operation Platform (backend).
# Postgres = state layer; Redis = BullMQ orchestration substrate (used in later phases).
# DATABASE_URL in apps/api/.env must match the postgres service below.
services:
  postgres:
    image: postgres:16-alpine
    container_name: uop-postgres
    environment:
      POSTGRES_USER: uop
      POSTGRES_PASSWORD: uop
      POSTGRES_DB: platform
    ports:
      # host 5433 → 避開機器上已佔用 5432 的既有 Postgres(container 內仍 5432)
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uop -d platform']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: uop-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
