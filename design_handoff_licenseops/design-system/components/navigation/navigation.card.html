<!-- @dsCard group="Components" viewport="700x400" name="Navigation" subtitle="NavItem · Stepper · Tabs · Pagination" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg)}</style></head>
<body><div id="r"></div>
<script type="text/babel">
const NS = Object.values(window).find(v => v && typeof v==='object' && v.NavItem && v.Stepper && v.Tabs) || {};
const { NavItem, Stepper, Tabs, Pagination } = NS;
const Ico = (d)=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
function Demo(){
  const [tab,setTab]=React.useState('summary');
  const [pg,setPg]=React.useState(3);
  return (<div style={{display:'flex',flexDirection:'column',gap:20}}>
    <div style={{display:'flex',gap:24,alignItems:'flex-start'}}>
      <div style={{width:218,background:'var(--sidebar)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 8px',display:'flex',flexDirection:'column',gap:2}}>
        <NavItem icon={Ico('M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z')} label="Overview" active/>
        <NavItem icon={Ico('M22 12h-6l-2 3h-4l-2-3H2')} label="Requests" count={6}/>
        <NavItem icon={Ico('M12 2 2 7l10 5 10-5-10-5z')} label="License Assets"/>
        <NavItem icon={Ico('m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z')} label="Drift Alerts" count={3} countTone="danger"/>
        <NavItem icon={Ico('M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-.1')} label="Offboarding" disabled soon/>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:18,paddingTop:6}}>
        <div style={{display:'flex',flexDirection:'column',gap:7}}><span style={{font:'500 11px var(--font-sans)',color:'var(--fg-subtle)'}}>Short path · Ready</span><Stepper steps={['Requested','Ready','Assigned']} current="Ready"/></div>
        <div style={{display:'flex',flexDirection:'column',gap:7}}><span style={{font:'500 11px var(--font-sans)',color:'var(--fg-subtle)'}}>Procurement · Quoting</span><Stepper steps={['Requested','Quoting','OpCo approved','Awaiting vendor','Ready','Assigned']} current={1}/></div>
        <div style={{display:'flex',flexDirection:'column',gap:7}}><span style={{font:'500 11px var(--font-sans)',color:'var(--fg-subtle)'}}>Procurement · Assigned</span><Stepper steps={['Requested','Quoting','OpCo approved','Awaiting vendor','Ready','Assigned']} current={5}/></div>
      </div>
    </div>
    <div style={{display:'flex',gap:24,alignItems:'flex-start',flexWrap:'wrap'}}>
      <div style={{width:300}}><Tabs value={tab} onChange={setTab} tabs={[{value:'summary',label:'Summary'},{value:'analytics',label:'Analytics'},{value:'attention',label:'Needs attention',count:4}]}/></div>
      <div style={{flex:1,minWidth:320,background:'var(--card)',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}><Pagination page={pg} pageCount={8} total={184} pageSize={25} onChange={setPg}/></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('r')).render(<Demo/>);
</script>
</body></html>
