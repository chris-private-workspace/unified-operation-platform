<!-- @dsCard group="Components" viewport="700x300" name="Display" subtitle="Card · StatCard · Badge · Avatar" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg)}</style></head>
<body><div id="r"></div>
<script type="text/babel">
const NS = Object.values(window).find(v => v && typeof v==='object' && v.Card && v.StatCard && v.Badge) || {};
const { Card, StatCard, Badge, Avatar } = NS;
const Ico = (d)=><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
function Demo(){
  return (<div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
    <div style={{display:'flex',gap:12}}>
      <StatCard label="Open requests" value="6" tone="info" icon={Ico('M22 12h-6l-2 3h-4l-2-3H2')} sub="across all OpCos"/>
      <StatCard label="Licenses assigned" value="1,053" tone="ok" delta="+42 free" icon={Ico('M12 2 2 7l10 5 10-5-10-5z')} sub="seats in use"/>
    </div>
    <Card title="Needs attention" subtitle="4 items" style={{width:280}} action={<a style={{fontSize:12,color:'var(--fg-muted)'}}>View →</a>}>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}><Avatar name="May Chan"/><div style={{flex:1,display:'flex',flexDirection:'column',lineHeight:1.25}}><span style={{fontSize:12.5,fontWeight:550}}>REQ-2041 · May Chan</span><span style={{fontSize:11.5,color:'var(--fg-subtle)'}}>Power BI Pro ready</span></div><Badge tone="ok" dot>Assign</Badge></div>
        <div style={{display:'flex',alignItems:'center',gap:10}}><Avatar name="Grace Lim"/><div style={{flex:1,display:'flex',flexDirection:'column',lineHeight:1.25}}><span style={{fontSize:12.5,fontWeight:550}}>REQ-2048 · Grace Lim</span><span style={{fontSize:11.5,color:'var(--fg-subtle)'}}>Waiting on Azure sync</span></div><Badge tone="danger" dot>Blocked</Badge></div>
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',paddingTop:4}}>
          <Badge tone="info">Requested</Badge><Badge tone="warn">Quoting</Badge><Badge tone="ok">Ready</Badge><Badge tone="neutral">Assigned</Badge><Badge tone="purple">AI</Badge>
        </div>
      </div>
    </Card>
    <Avatar name="Alex Tan" variant="brand" size={40}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('r')).render(<Demo/>);
</script>
</body></html>
