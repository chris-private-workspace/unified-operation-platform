<!-- @dsCard group="Components" viewport="700x360" name="Feedback" subtitle="Dialog · Toast · EmptyState" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg)}</style></head>
<body><div id="r"></div>
<script type="text/babel">
const NS = Object.values(window).find(v => v && typeof v==='object' && v.EmptyState && v.Button) || {};
const { EmptyState, Button, Input, Select } = NS;
const Chk = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>;
function Demo(){
  return (<div style={{display:'grid',gridTemplateColumns:'400px 1fr',gap:20,alignItems:'start'}}>
    {/* Dialog (rendered inline so it shows inside the card) */}
    <div>
      <span style={{font:'600 10.5px var(--font-sans)',letterSpacing:'.06em',textTransform:'uppercase',color:'var(--fg-subtle)'}}>Dialog</span>
      <div style={{marginTop:8,background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,boxShadow:'var(--shadow-overlay)',overflow:'hidden'}}>
        <div style={{padding:'16px 18px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}><h3 style={{margin:0,fontSize:14,fontWeight:600}}>Edit SKU · Copilot</h3><span style={{color:'var(--fg-muted)',fontSize:16}}>✕</span></div>
        <div style={{padding:18,display:'flex',flexDirection:'column',gap:13}}>
          <div style={{display:'flex',flexDirection:'column',gap:5}}><label style={{fontSize:11.5,fontWeight:550,color:'var(--fg-muted)'}}>Business alias</label><Input value="Copilot" onChange={()=>{}}/></div>
          <div style={{display:'flex',flexDirection:'column',gap:5}}><label style={{fontSize:11.5,fontWeight:550,color:'var(--fg-muted)'}}>Category</label><Select style={{width:'100%'}}><option>Add-on</option><option>Base</option></Select></div>
        </div>
        <div style={{padding:'14px 18px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'flex-end',gap:9}}><Button variant="ghost">Cancel</Button><Button variant="primary">Save changes</Button></div>
      </div>
    </div>

    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      {/* EmptyState */}
      <div>
        <span style={{font:'600 10.5px var(--font-sans)',letterSpacing:'.06em',textTransform:'uppercase',color:'var(--fg-subtle)'}}>EmptyState</span>
        <div style={{marginTop:8,background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,boxShadow:'var(--shadow)'}}>
          <EmptyState tone="ok" icon={Chk} title="No open drift alerts" description="The ledger matches tenant consumption. Last run today 06:00." action={<Button variant="secondary" size="sm">Run reconciliation</Button>}/>
        </div>
      </div>
      {/* Toast */}
      <div>
        <span style={{font:'600 10.5px var(--font-sans)',letterSpacing:'.06em',textTransform:'uppercase',color:'var(--fg-subtle)'}}>Toast</span>
        <div style={{marginTop:8,display:'flex',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 16px',borderRadius:10,background:'#131317',color:'#fff',boxShadow:'var(--shadow-toast)'}}>
            <span style={{width:18,height:18,borderRadius:'50%',background:'var(--ok)',display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span style={{fontSize:12.5,fontWeight:500}}>License assigned to user</span>
          </div>
        </div>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('r')).render(<Demo/>);
</script>
</body></html>
