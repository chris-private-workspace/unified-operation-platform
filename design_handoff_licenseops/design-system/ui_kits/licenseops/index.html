<!-- @dsCard group="LicenseOps Console" viewport="1400x880" -->
<!-- @startingPoint section="LicenseOps Console" subtitle="Operations Overview dashboard — KPIs, needs-attention, drift, roadmap, activity" viewport="1400x880" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LicenseOps — Overview</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}#root{height:100%}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(v => v && typeof v==='object' && v.StatCard && v.NavItem && v.Card) || {};
const { NavItem, StatCard, Card, Badge, Avatar, SegmentedControl, IconButton, Input, Toast } = NS;

const I = (d, w=16) => <svg width={w} height={w} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d.map((p,i)=><path key={i} d={p}/>)}</svg>;

const NAV = [
  ['overview','Overview',['M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z']],
  ['requests','Requests',['M22 12h-6l-2 3h-4l-2-3H2','M5.4 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.7 4H7.2a2 2 0 0 0-1.8 1.1z']],
  ['assets','License Assets',['M12 2 2 7l10 5 10-5-10-5z','m2 17 10 5 10-5','m2 12 10 5 10-5']],
  ['drift','Drift Alerts',['m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z','M12 9v4','M12 17h.01']],
  ['catalog','SKU Catalog',['M21 8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z','M3.3 7 12 12l8.7-5','M12 22V12']],
];

const KPIS = [
  {label:'Open requests', value:'6', tone:'info', sub:'across all OpCos', icon:['M22 12h-6l-2 3h-4l-2-3H2']},
  {label:'In procurement', value:'2', tone:'warn', sub:'awaiting quote / vendor', icon:['M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z']},
  {label:'Open drift alerts', value:'3', tone:'danger', sub:'ledger vs tenant', icon:['m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z']},
  {label:'Licenses assigned', value:'1,053', tone:'ok', delta:'+128 free', sub:'seats in use · headroom', icon:['M12 2 2 7l10 5 10-5-10-5z']},
];

const NEEDS = [
  {t:'REQ-2041 · May Chan', m:'Power BI Pro ready to assign', tag:'Assign', tone:'ok', age:'2d'},
  {t:'REQ-2048 · Grace Lim', m:'Account created, waiting on Azure AD sync', tag:'Blocked', tone:'danger', age:'4h'},
  {t:'REQ-2035 · Linh Pham', m:'Stuck in procurement — QT-7802', tag:'Procurement', tone:'warn', age:'6d'},
  {t:'REQ-2045 · Somchai Prasert', m:'Defender for O365 ready to assign', tag:'Assign', tone:'ok', age:'5h'},
];
const DRIFT = [['Microsoft 365 E3','+3','danger'],['Power BI Pro','-2','warn'],['Microsoft 365 Copilot','+1','danger']];
const ROAD = [['OpCo IT self-service portal','In progress','info'],['AI assist — parse remarks','Next','purple'],['Richer procurement tracking','Planned','neutral'],['Dynamics 365 licenses','Backlog','neutral']];
const ACT = [
  ['M20 6 9 17l-5-5','ok','Alex Tan assigned Office 365 F3 to may.chan@rhk.ricoh.com.hk','REQ-2041','10:05'],
  ['m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z','danger','Drift alert opened — Microsoft 365 E3 delta +3','Tenant','09:40'],
  ['M3 12a9 9 0 0 1 15-6.7L21 8','info','Copilot → Quoting (no seats available)','REQ-2041 · QT-7781','Jul 7'],
  ['M20 6 9 17l-5-5','ok','Power BI Pro → Ready to assign','REQ-2041','Jul 7'],
];
const soft = {ok:'var(--ok-soft)',danger:'var(--danger-soft)',info:'var(--info-soft)',warn:'var(--warn-soft)'};
const solid = {ok:'var(--ok)',danger:'var(--danger)',info:'var(--info)',warn:'var(--warn)'};

function App(){
  const [dark,setDark]=React.useState(false);
  const [role,setRole]=React.useState('Regional');
  const [nav,setNav]=React.useState('overview');
  const [toast,setToast]=React.useState(null);
  const fire=(m)=>{setToast(m);clearTimeout(window._t);window._t=setTimeout(()=>setToast(null),2400);};
  React.useEffect(()=>{document.documentElement.className=dark?'dark':'';},[dark]);

  return (
  <div style={{display:'flex',height:'100%',overflow:'hidden',background:'var(--bg)',color:'var(--fg)',fontSize:13.5}}>
    {/* sidebar */}
    <aside style={{width:248,flexShrink:0,background:'var(--sidebar)',borderRight:'1px solid var(--border)',display:'flex',flexDirection:'column'}}>
      <div style={{height:56,display:'flex',alignItems:'center',gap:10,padding:'0 18px',borderBottom:'1px solid var(--border)'}}>
        <div style={{width:28,height:28,borderRadius:7,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center'}}>{I(['M4 4h16v6H4z','M4 14h10v6H4z','M18 14h2v6h-2z'],17)}<span style={{position:'absolute'}}></span></div>
        <div style={{display:'flex',flexDirection:'column',lineHeight:1.15}}><span style={{fontWeight:600}}>LicenseOps</span><span style={{fontSize:11,color:'var(--fg-subtle)'}}>Ricoh APAC IT</span></div>
      </div>
      <nav style={{flex:1,padding:'14px 12px',display:'flex',flexDirection:'column',gap:2}}>
        <div style={{fontSize:10.5,fontWeight:600,letterSpacing:'.06em',color:'var(--fg-subtle)',padding:'6px 10px 5px',textTransform:'uppercase'}}>Operations</div>
        {NAV.map(([id,label,d])=>(
          <NavItem key={id} icon={I(d)} label={label} active={nav===id}
            count={id==='requests'?6:id==='drift'?3:null} countTone={id==='drift'?'danger':'neutral'}
            onClick={()=>{setNav(id); if(id!=='overview') fire(label+' — demo view');}}/>
        ))}
        <div style={{fontSize:10.5,fontWeight:600,letterSpacing:'.06em',color:'var(--fg-subtle)',padding:'12px 10px 5px',textTransform:'uppercase'}}>Roadmap</div>
        <NavItem icon={I(['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2','M9 11a4 4 0 1 0 0-.1'])} label="Offboarding" disabled soon/>
        <NavItem icon={I(['M3 3v18h18','m19 9-5 5-4-4-3 3'])} label="Cost Insights" disabled soon/>
      </nav>
      <div style={{padding:12,borderTop:'1px solid var(--border)'}}>
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'8px 10px',borderRadius:9,background:'var(--card)',border:'1px solid var(--border)'}}>
          <Avatar name={role==='Regional'?'Alex Tan':'May Wong'} variant="brand"/>
          <div style={{display:'flex',flexDirection:'column',lineHeight:1.2,flex:1,minWidth:0}}><span style={{fontWeight:550,fontSize:12.5}}>{role==='Regional'?'Alex Tan':'May Wong'}</span><span style={{fontSize:11,color:'var(--fg-subtle)'}}>{role==='Regional'?'Regional IT operator':'RHK IT · OpCo admin'}</span></div>
        </div>
      </div>
    </aside>

    {/* main */}
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
      <header style={{height:56,flexShrink:0,display:'flex',alignItems:'center',gap:16,padding:'0 22px',borderBottom:'1px solid var(--border)',background:'var(--panel)'}}>
        <div style={{display:'flex',flexDirection:'column',lineHeight:1.15}}><h1 style={{margin:0,fontSize:15,fontWeight:600}}>Overview</h1><span style={{fontSize:11.5,color:'var(--fg-subtle)'}}>{role==='Regional'?'Regional — all OpCos':'RHK IT — RHK only'}</span></div>
        <div style={{flex:1,maxWidth:420,margin:'0 auto'}}><Input icon={I(['M11 11 21 21','M11 6a5 5 0 1 1 0 10 5 5 0 0 1 0-10z'],15)} placeholder="Search requests, users, SKUs…"/></div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <SegmentedControl options={['Regional','RHK IT']} value={role} onChange={setRole}/>
          <IconButton title="Toggle theme" onClick={()=>setDark(d=>!d)}>{dark?I(['M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z']):I(['M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'])}</IconButton>
        </div>
      </header>

      <main style={{flex:1,overflowY:'auto',padding:'22px 24px 40px',display:'flex',flexDirection:'column',gap:18}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}}>
          {KPIS.map(k=><StatCard key={k.label} {...k} icon={I(k.icon,15)}/>)}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1.55fr 1fr',gap:16,alignItems:'start'}}>
          <Card title="Needs attention" action={<a style={{fontSize:12,color:'var(--fg-muted)',cursor:'pointer'}} onClick={()=>fire('Requests — demo view')}>View all requests →</a>} padded={false}>
            {NEEDS.map((n,i)=>(
              <div key={i} onClick={()=>fire('Opening '+n.t.split('·')[0].trim())} style={{display:'flex',alignItems:'center',gap:13,padding:'12px 16px',borderBottom:i<NEEDS.length-1?'1px solid var(--border)':'none',cursor:'pointer'}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:solid[n.tone],flexShrink:0}}></span>
                <div style={{flex:1,display:'flex',flexDirection:'column',lineHeight:1.3}}><span style={{fontWeight:550,fontSize:12.5}}>{n.t}</span><span style={{fontSize:11.5,color:'var(--fg-subtle)'}}>{n.m}</span></div>
                <Badge tone={n.tone}>{n.tag}</Badge>
                <span style={{fontSize:11,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)',width:34,textAlign:'right'}}>{n.age}</span>
              </div>
            ))}
          </Card>

          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <Card title="Drift summary" action={<a style={{fontSize:12,color:'var(--fg-muted)',cursor:'pointer'}} onClick={()=>fire('Drift Alerts — demo view')}>Open →</a>}>
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                <div style={{display:'flex',alignItems:'baseline',gap:8}}><span style={{fontSize:26,fontWeight:600,letterSpacing:'-.02em'}}>3</span><span style={{fontSize:12,color:'var(--fg-muted)'}}>open alerts · last run 06:00</span></div>
                {DRIFT.map(([sku,delta,tone])=><div key={sku} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><span style={{fontSize:12.5}}>{sku}</span><Badge tone={tone} style={{fontFamily:'var(--font-mono)'}}>{delta}</Badge></div>)}
              </div>
            </Card>
            <Card title="On the roadmap">
              <div style={{display:'flex',flexDirection:'column',gap:9}}>
                {ROAD.map(([t,tag,tone])=><div key={t} style={{display:'flex',alignItems:'center',gap:10}}><span style={{width:6,height:6,borderRadius:'50%',background:tone==='neutral'?'var(--border-strong)':solid[tone]||'var(--info)',flexShrink:0}}></span><span style={{fontSize:12.5,flex:1}}>{t}</span><Badge tone={tone} style={{fontSize:10.5}}>{tag}</Badge></div>)}
              </div>
            </Card>
          </div>
        </div>

        <Card title="Recent activity" padded={false}>
          {ACT.map(([d,tone,text,ref,time],i)=>(
            <div key={i} style={{display:'flex',alignItems:'flex-start',gap:12,padding:'9px 16px'}}>
              <span style={{width:24,height:24,borderRadius:6,background:soft[tone],color:solid[tone],display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{I([d],13)}</span>
              <div style={{flex:1,fontSize:12.5,lineHeight:1.4}}>{text} <span style={{color:'var(--fg-subtle)'}}>{ref}</span></div>
              <span style={{fontSize:11,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>{time}</span>
            </div>
          ))}
        </Card>
      </main>
    </div>
    <Toast message={toast} tone="ok"/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
