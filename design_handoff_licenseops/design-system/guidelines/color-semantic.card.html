<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="ok · warn · info · danger · neutral · purple — solid + soft pairs" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:5px}
.chip{width:96px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:600 11px var(--font-sans)}
.n{font:600 11.5px var(--font-sans);color:var(--fg)}</style></head>
<body>
<div class="sw"><div class="chip" style="background:var(--ok-soft);color:var(--ok)">ok</div><span class="n">ok</span></div>
<div class="sw"><div class="chip" style="background:var(--warn-soft);color:var(--warn)">warn</div><span class="n">warn</span></div>
<div class="sw"><div class="chip" style="background:var(--info-soft);color:var(--info)">info</div><span class="n">info</span></div>
<div class="sw"><div class="chip" style="background:var(--danger-soft);color:var(--danger)">danger</div><span class="n">danger</span></div>
<div class="sw"><div class="chip" style="background:var(--neutral-soft);color:var(--neutral)">neutral</div><span class="n">neutral</span></div>
<div class="sw"><div class="chip" style="background:var(--purple-soft);color:var(--purple)">purple</div><span class="n">purple · AI</span></div>
</body></html>
