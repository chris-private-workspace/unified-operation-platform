<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & surfaces (light)" subtitle="Background, panel, card, hover, borders, text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:5px}
.chip{width:96px;height:56px;border-radius:9px;border:1px solid var(--border)}
.n{font:600 11.5px var(--font-sans);color:var(--fg)}
.h{font:500 10.5px var(--font-mono);color:var(--fg-subtle)}</style></head>
<body>
<div class="sw"><div class="chip" style="background:var(--bg)"></div><span class="n">bg</span><span class="h">#f5f5f6</span></div>
<div class="sw"><div class="chip" style="background:var(--card)"></div><span class="n">card / panel</span><span class="h">#ffffff</span></div>
<div class="sw"><div class="chip" style="background:var(--hover)"></div><span class="n">hover</span><span class="h">#efeff1</span></div>
<div class="sw"><div class="chip" style="background:var(--border)"></div><span class="n">border</span><span class="h">#e9e9ec</span></div>
<div class="sw"><div class="chip" style="background:var(--border-strong)"></div><span class="n">border-strong</span><span class="h">#d7d7dc</span></div>
<div class="sw"><div class="chip" style="background:var(--fg)"></div><span class="n">fg</span><span class="h">#131317</span></div>
<div class="sw"><div class="chip" style="background:var(--fg-muted)"></div><span class="n">fg-muted</span><span class="h">#63636c</span></div>
</body></html>
