<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals & surfaces (dark)" subtitle="Same roles, dark theme values" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html{background:#08080a}body{margin:0;padding:16px;display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:5px}
.chip{width:96px;height:56px;border-radius:9px;border:1px solid var(--border)}
.n{font:600 11.5px var(--font-sans);color:var(--fg)}
.h{font:500 10.5px var(--font-mono);color:var(--fg-subtle)}</style></head>
<body class="dark">
<div class="sw"><div class="chip" style="background:var(--bg)"></div><span class="n">bg</span><span class="h">#08080a</span></div>
<div class="sw"><div class="chip" style="background:var(--card)"></div><span class="n">card</span><span class="h">#141417</span></div>
<div class="sw"><div class="chip" style="background:var(--hover)"></div><span class="n">hover</span><span class="h">#1b1b1f</span></div>
<div class="sw"><div class="chip" style="background:var(--border)"></div><span class="n">border</span><span class="h">#242427</span></div>
<div class="sw"><div class="chip" style="background:var(--border-strong)"></div><span class="n">border-strong</span><span class="h">#34343a</span></div>
<div class="sw"><div class="chip" style="background:var(--accent)"></div><span class="n">accent</span><span class="h">#ff3355</span></div>
<div class="sw"><div class="chip" style="background:var(--fg)"></div><span class="n">fg</span><span class="h">#f3f3f5</span></div>
</body></html>
