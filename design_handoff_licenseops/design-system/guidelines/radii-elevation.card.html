<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & elevation" subtitle="Corner radii and the two shadow levels" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{width:66px;height:50px;background:var(--card);border:1px solid var(--border)}
.n{font:500 10.5px var(--font-mono);color:var(--fg-subtle)}
.nn{font:600 11px var(--font-sans);color:var(--fg)}</style></head>
<body>
<div class="sw"><div class="box" style="border-radius:6px"></div><span class="n">6 sm</span></div>
<div class="sw"><div class="box" style="border-radius:7px"></div><span class="n">7 md</span></div>
<div class="sw"><div class="box" style="border-radius:8px"></div><span class="n">8 lg</span></div>
<div class="sw"><div class="box" style="border-radius:12px"></div><span class="n">12 card</span></div>
<div class="sw"><div class="box" style="border-radius:14px"></div><span class="n">14 dialog</span></div>
<div class="sw"><div class="box" style="border-radius:999px;width:50px"></div><span class="n">pill</span></div>
<div style="width:1px;height:56px;background:var(--border)"></div>
<div class="sw"><div class="box" style="border-radius:12px;box-shadow:var(--shadow)"></div><span class="nn">shadow</span></div>
<div class="sw"><div class="box" style="border-radius:14px;box-shadow:var(--shadow-overlay)"></div><span class="nn">overlay</span></div>
</body></html>
