<!-- @dsCard group="Colors" viewport="700x150" name="Brand accent — Ricoh red" subtitle="The single restrained accent, plus soft tint & line" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);display:flex;gap:12px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:120px;height:64px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
.n{font:600 12px var(--font-sans);color:var(--fg)}
.h{font:500 11px var(--font-mono);color:var(--fg-subtle)}</style></head>
<body>
<div class="sw"><div class="chip" style="background:var(--accent)"><span style="font:600 11px var(--font-mono);color:#fff">#E60027</span></div><span class="n">accent</span><span class="h">primary / active / links</span></div>
<div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><span class="n">accent-soft</span><span class="h">#fdecef</span></div>
<div class="sw"><div class="chip" style="background:var(--accent-line)"></div><span class="n">accent-line</span><span class="h">#f6c9d2</span></div>
<div class="sw"><div class="chip" style="background:linear-gradient(150deg,#c30021,#8a0018 55%,#4d000d)"><span style="font:600 11px var(--font-mono);color:#fff">gradient</span></div><span class="n">brand panel</span><span class="h">login / marketing</span></div>
</body></html>
