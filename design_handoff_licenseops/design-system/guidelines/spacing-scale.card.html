<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="Tight 2px-stepped rhythm used across dense tables" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--card);display:flex;align-items:flex-end;gap:14px;font-family:var(--font-mono)}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--accent);border-radius:3px;width:22px}
.n{font-size:10.5px;color:var(--fg-subtle)}</style></head>
<body>
<div class="sw"><div class="bar" style="height:4px"></div><span class="n">2</span></div>
<div class="sw"><div class="bar" style="height:8px"></div><span class="n">4</span></div>
<div class="sw"><div class="bar" style="height:12px"></div><span class="n">6</span></div>
<div class="sw"><div class="bar" style="height:16px"></div><span class="n">8</span></div>
<div class="sw"><div class="bar" style="height:20px"></div><span class="n">10</span></div>
<div class="sw"><div class="bar" style="height:24px"></div><span class="n">12</span></div>
<div class="sw"><div class="bar" style="height:28px"></div><span class="n">14</span></div>
<div class="sw"><div class="bar" style="height:32px"></div><span class="n">16</span></div>
<div class="sw"><div class="bar" style="height:44px"></div><span class="n">22</span></div>
<div class="sw"><div class="bar" style="height:48px"></div><span class="n">24</span></div>
</body></html>
